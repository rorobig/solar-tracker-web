<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Solar Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
    .app { max-width: 420px; margin: 0 auto; padding-top: 48px; }
    h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 0.5px solid #e0e0e0; }
    input[type=text], input[type=number] { width: 100%; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 10px; font-size: 15px; margin-bottom: 10px; outline: none; }
    input:focus { border-color: #639922; }
    .btn { width: 100%; background: #639922; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
    .btn:active { opacity: 0.85; }
    .btn-outline { width: 100%; background: transparent; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; }
    .btn-outline:active { opacity: 0.85; }
    .duration-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .duration-row label { font-size: 13px; color: #666; white-space: nowrap; }
    .duration-row input { width: 60px; margin-bottom: 0; text-align: center; }
    .duration-row span { font-size: 13px; color: #666; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .metric { background: #fff; border-radius: 8px; padding: 12px; border: 0.5px solid #e0e0e0; }
    .metric-label { font-size: 11px; color: #666; margin-bottom: 4px; }
    .metric-value { font-size: 20px; font-weight: 500; }
    .metric-sub { font-size: 11px; color: #999; margin-top: 2px; }
    .section-title { font-size: 11px; font-weight: 500; color: #666; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }
    .now-row { font-size: 12px; color: #666; margin-bottom: 10px; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .bar-label { font-size: 11px; color: #666; width: 36px; text-align: right; flex-shrink: 0; }
    .bar-track { flex: 1; height: 18px; background: #f5f5f5; border-radius: 4px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; transition: width 0.4s ease; }
    .bar-fill span { font-size: 10px; color: #fff; font-weight: 500; }
    .window-highlight { position: absolute; top: 0; bottom: 0; background: rgba(99,153,34,0.15); border-left: 2px solid #639922; pointer-events: none; }
    .now-tag { font-size: 10px; color: #639922; font-weight: 500; }
    .window-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .window-block { border-radius: 8px; padding: 10px 12px; border: 1px solid #e0e0e0; }
    .window-block.best { border-color: #639922; }
    .window-time { font-size: 13px; font-weight: 500; }
    .window-pow { font-size: 12px; color: #666; margin-top: 2px; }
    .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 500; margin-bottom: 4px; }
    .badge-best { background: #EAF3DE; color: #27500A; }
    .badge-good { background: #E6F1FB; color: #185FA5; }
    .tip { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .tip-icon { font-size: 22px; flex-shrink: 0; }
    .tip-name { font-size: 13px; font-weight: 500; }
    .tip-text { font-size: 13px; color: #666; }
    .spinner { display: flex; justify-content: center; padding: 32px; }
    .spinner div { width: 24px; height: 24px; border: 2px solid #e0e0e0; border-top-color: #639922; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #993C1D; font-size: 13px; margin-top: 6px; }
    #results { display: none; }
  </style>
</head>
<body>
<div class="app">
  <h1>☀️ Solar peak tracker</h1>
  <p class="subtitle">Best times to run your appliances</p>

  <div class="card">
    <input type="text" id="cityInput" placeholder="Enter city name…" />
    <div class="duration-row">
      <label>Appliance runtime</label>
      <input type="number" id="duration" value="3" min="1" max="8" />
      <span>hours</span>
    </div>
    <button class="btn" onclick="fetchByCity()">Get solar forecast</button>
    <button class="btn-outline" onclick="useGPS()">📍 Use my location</button>
    <p id="errMsg" class="error" style="display:none;"></p>
  </div>

  <div id="spinner" class="spinner" style="display:none;"><div></div></div>

  <div id="results">
    <div class="metrics">
      <div class="metric"><div class="metric-label">Best start time</div><div class="metric-value" id="bestTime">—</div><div class="metric-sub" id="bestWindow">—</div></div>
      <div class="metric"><div class="metric-label">Peak power</div><div class="metric-value" id="peakPower">—</div><div class="metric-sub">W/m² max</div></div>
      <div class="metric"><div class="metric-label">Sunrise</div><div class="metric-value" id="sunrise">—</div><div class="metric-sub">Local time</div></div>
      <div class="metric"><div class="metric-label">Sunset</div><div class="metric-value" id="sunset">—</div><div class="metric-sub">Local time</div></div>
    </div>
    <div class="card">
      <p class="section-title">Hourly solar power today</p>
      <p class="now-row" id="nowRow"></p>
      <div id="barChart"></div>
    </div>
    <div class="card">
      <p class="section-title" id="windowsTitle">Best windows</p>
      <div class="window-grid" id="windowGrid"></div>
    </div>
    <div class="card">
      <p class="section-title">Appliance tips</p>
      <div id="tips"></div>
    </div>
  </div>
</div>

<script>
  let cachedData = null;

  function showErr(m) {
    const e = document.getElementById('errMsg');
    e.textContent = m; e.style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
  }
  function setLoading(on) {
    document.getElementById('errMsg').style.display = 'none';
    document.getElementById('spinner').style.display = on ? 'flex' : 'none';
    document.getElementById('results').style.display = on ? 'none' : 'block';
  }
  function fmtTime(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function barColor(pct, isNow) {
    if (isNow) return '#1D9E75';
    if (pct > 70) return '#639922';
    if (pct > 35) return '#378ADD';
    return '#B4B2A9';
  }

  // sliding window — finds best N-hour block
  function bestWindow(total, times, windowSize) {
    let bestSum = -1, bestIdx = 0;
    for (let i = 0; i <= total.length - windowSize; i++) {
      const h = parseInt(times[i].split('T')[1]);
      if (h < 6 || h + windowSize > 20) continue; // keep within daylight
      const sum = total.slice(i, i + windowSize).reduce((a, b) => a + b, 0);
      if (sum > bestSum) { bestSum = sum; bestIdx = i; }
    }
    return { idx: bestIdx, sum: bestSum, avg: bestSum / windowSize };
  }

  async function fetchByCoords(lat, lon) {
    setLoading(true);
    try {
      const today = new Date().toISOString().split('T')[0];
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=direct_radiation,diffuse_radiation&daily=sunrise,sunset&timezone=auto&start_date=${today}&end_date=${today}`);
      const data = await res.json();
      cachedData = data;
      render(data);
      setLoading(false);
    } catch {
      showErr('Could not load solar data. Check your connection.');
    }
  }

  async function fetchByCity() {
    const city = document.getElementById('cityInput').value.trim();
    if (!city) return;
    setLoading(true);
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
      const data = await res.json();
      if (!data.results?.length) { showErr('City not found. Try a different name.'); return; }
      const { latitude, longitude } = data.results[0];
      await fetchByCoords(latitude, longitude);
    } catch {
      showErr('Could not look up city. Check your connection.');
      setLoading(false);
    }
  }

  async function useGPS() {
    if (!navigator.geolocation) { showErr('GPS not available in this browser'); return; }
    setLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos => fetchByCoords(pos.coords.latitude, pos.coords.longitude),
      () => showErr('Location denied. Please enter your city manually.')
    );
  }

  // re-render with new duration without re-fetching
  document.getElementById('duration').addEventListener('change', () => {
    if (cachedData) render(cachedData);
  });

  function render(data) {
    const duration = Math.max(1, parseInt(document.getElementById('duration').value) || 3);
    const times = data.hourly.time;
    const total = times.map((_, i) =>
      (data.hourly.direct_radiation[i] || 0) + (data.hourly.diffuse_radiation[i] || 0)
    );
    const maxVal = Math.max(...total, 1);
    const nowH = new Date().getHours();
    const nowV = total[nowH] || 0;

    // best sliding window
    const best = bestWindow(total, times, duration);
    const bestH = parseInt(times[best.idx].split('T')[1]);
    const bestEndH = bestH + duration;

    document.getElementById('bestTime').textContent = `${bestH}:00`;
    document.getElementById('bestWindow').textContent = `Run until ${bestEndH}:00 (${duration}h window)`;
    document.getElementById('peakPower').textContent = Math.round(maxVal);
    document.getElementById('sunrise').textContent = fmtTime(data.daily.sunrise?.[0]);
    document.getElementById('sunset').textContent = fmtTime(data.daily.sunset?.[0]);
    document.getElementById('nowRow').textContent =
      `Now (${nowH}:00): ${Math.round(nowV)} W/m² — ${Math.round((nowV / maxVal) * 100)}% of peak`;
    document.getElementById('windowsTitle').textContent =
      `Top ${duration}-hour windows today`;

    // bar chart with best window highlighted
    const bar = document.getElementById('barChart');
    bar.innerHTML = '';
    times.forEach((t, i) => {
      const h = parseInt(t.split('T')[1]);
      if (h < 5 || h > 21) return;
      const v = total[i] || 0;
      const pct = Math.round((v / maxVal) * 100);
      const isNow = h === nowH;
      const inBestWindow = h >= bestH && h < bestEndH;
      bar.innerHTML += `
        <div class="bar-row">
          <span class="bar-label">${h}:00</span>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;background:${barColor(pct, isNow)};">
              ${pct > 12 ? `<span>${Math.round(v)}</span>` : ''}
            </div>
            ${inBestWindow ? '<div class="window-highlight" style="left:0;right:0;"></div>' : ''}
          </div>
          ${isNow ? '<span class="now-tag">NOW</span>' : ''}
        </div>`;
    });

    // rank all valid windows by sum
    const windows = [];
    for (let i = 0; i <= total.length - duration; i++) {
      const h = parseInt(times[i].split('T')[1]);
      if (h < 6 || h + duration > 20) continue;
      const sum = total.slice(i, i + duration).reduce((a, b) => a + b, 0);
      windows.push({ h, sum, avg: Math.round(sum / duration) });
    }
    windows.sort((a, b) => b.sum - a.sum);

    // remove overlapping windows for cleaner list
    const shown = [];
    for (const w of windows) {
      const overlaps = shown.some(s => Math.abs(s.h - w.h) < duration);
      if (!overlaps) shown.push(w);
      if (shown.length >= 6) break;
    }

    const grid = document.getElementById('windowGrid');
    grid.innerHTML = '';
    shown.forEach(({ h, avg }, i) => {
      grid.innerHTML += `
        <div class="window-block ${i === 0 ? 'best' : ''}">
          ${i === 0 ? '<span class="badge badge-best">★ Best</span>' : i < 3 ? '<span class="badge badge-good">Good</span>' : ''}
          <div class="window-time">${h}:00 – ${h + duration}:00</div>
          <div class="window-pow">avg ${avg} W/m²</div>
        </div>`;
    });

    document.getElementById('tips').innerHTML = [
      { icon: '🫧', name: 'Washing machine', tip: `Start at ${bestH}:00 — runs until ${bestEndH}:00` },
      { icon: '🍽️', name: 'Dishwasher', tip: `Start at ${bestH}:00 — peak ${duration}h window` },
      { icon: '🔌', name: 'High-power devices', tip: `Best window: ${bestH}:00–${bestEndH}:00` },
    ].map(a => `
      <div class="tip">
        <span class="tip-icon">${a.icon}</span>
        <div><div class="tip-name">${a.name}</div><div class="tip-text">${a.tip}</div></div>
      </div>`).join('');
  }

  document.getElementById('cityInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchByCity();
  });
</script>
</body>
</html>
